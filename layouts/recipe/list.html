{{ define "main" }}
<article class="recipe">
  <header>
    <p class="meta">
      {{ if .Params.is_latest }}<span class="badge">Current · v{{ .Params.latest_version }}</span>{{ end }}
      {{ with .Params.recipe_id }}<span class="meta-quiet no-print">ID {{ . }}</span>{{ end }}
    </p>
    <h1>{{ .Title }}</h1>
  </header>
  {{ .Content }}
  {{ partial "jsonld.html" . }}
</article>
{{ end }}
