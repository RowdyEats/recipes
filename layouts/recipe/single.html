{{ define "main" }}
<article class="recipe">
  <header>
    <p class="meta">
      {{ with .Params.recipe_id }}<code>{{ . }}</code>{{ end }}
      {{ with .Params.recipe_version }} · immutable <code>v{{ . }}</code>{{ end }}
      {{ if .Params.slug_path }} · <a class="no-print" href="{{ printf "/%s/" .Params.slug_path | relURL }}">latest</a>{{ end }}
    </p>
    <h1>{{ .Title }}</h1>
  </header>
  {{ .Content }}
  {{ partial "jsonld.html" . }}
</article>
{{ end }}
