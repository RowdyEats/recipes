baseURL = "https://rowdyeats.github.io/recipes/"
languageCode = "en-us"
title = "RowdyEats Kitchen"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]
canonifyURLs = true
relativeURLs = false

[params]
  description = "Home-cooked recipes from the RowdyEats kitchen — chile, fire, and weekend smoke."
  owner = "RowdyEats"

[markup.goldmark.renderer]
  unsafe = true

# CSS still minified via pipes; avoid HTML minify (lowercases JSON-LD keys).
[minify]
  minifyOutput = false
